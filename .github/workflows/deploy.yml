name: CI/CD Pipeline - Deploy to Nginx

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # CI: Integración Continua (Pruebas / Lint)
  # ==========================================
  ci-test:
    name: CI - Verificación de Archivos
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código (Checkout)
        uses: actions/checkout@v4

      - name: Validar existencia de index.html
        run: |
          if [ -f "index.html" ]; then
            echo "✓ index.html encontrado con éxito."
          else
            echo "✗ Error: index.html no existe."
            exit 1
          fi

      - name: Validar estructura básica HTML
        run: |
          grep -q "<!DOCTYPE html>" index.html && \
          grep -q "<html" index.html && \
          grep -q "</html>" index.html
          echo "✓ Estructura HTML validada correctamente."

  # ==========================================
  # CD: Entrega/Despliegue Continuo (Servidor)
  # ==========================================
  cd-deploy:
    name: CD - Despliegue en Servidor Nginx
    needs: ci-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código (Checkout)
        uses: actions/checkout@v4

      - name: Copiar archivos al servidor web (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Si usas contraseña en vez de clave SSH, descomenta:
          # password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "index.html"
          target: "/var/www/html"

      - name: Recargar servicio Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            sudo systemctl reload nginx
            echo "✓ Nginx recargado exitosamente."
